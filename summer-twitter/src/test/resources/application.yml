server:
  port: 0
  allowedOrigins:
    - "*"

datasource:
  url: ${DATASOURCE_URL:-jdbc:postgresql://localhost:5432/summer}
  username: ${DATASOURCE_USERNAME:-summer}
  password: ${DATASOURCE_PASSWORD:-summer}
  driver-class-name: org.postgresql.Driver

redis:
  host: ${REDIS_HOST:-localhost}
  port: ${REDIS_PORT:-6379}

jwt:
  secret: ${JWT_SECRET:-test-secret-for-unit-tests-only-256-bit}
