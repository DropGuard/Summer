services:
  postgres:
    image: postgres:15
    container_name: summer-pg
    environment:
      POSTGRES_USER: summer
      POSTGRES_PASSWORD: summer
      POSTGRES_DB: summer
    ports:
      - "5432:5432"
    volumes:
      - ./init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: summer-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
