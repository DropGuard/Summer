server:
  port: 8080

datasource:
  url: ${DATASOURCE_URL:-jdbc:postgresql://localhost:5432/summer}
  username: ${DATASOURCE_USERNAME:-summer}
  password: ${DATASOURCE_PASSWORD:-summer}
  driver-class-name: org.postgresql.Driver

redis:
  uri: ${REDIS_URI:-redis://localhost:6379}

jwt:
  secret: ${JWT_SECRET:-this-is-a-dev-secret-at-least-256-bits-long-do-not-use-in-production}

cors:
  allowed-origins: "http://localhost:5173"
  allowed-methods: "GET, POST, PUT, DELETE, OPTIONS"
  allowed-headers: "Content-Type, Authorization"
  max-age: 3600
