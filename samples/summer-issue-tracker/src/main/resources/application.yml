server:
  port: 8080

datasource:
  url: ${SUMMER_DB_URL:-jdbc:postgresql://localhost:5432/issuetracker}
  username: ${SUMMER_DB_USER:-issuetracker}
  password: ${SUMMER_DB_PASSWORD:-issuetracker}
  driver-class-name: org.postgresql.Driver

cors:
  allowed-origins: "http://localhost:5173"
  allowed-methods: "GET, POST, PUT, DELETE, OPTIONS"
  allowed-headers: "Content-Type, Authorization"
  max-age: 3600

jwt:
  secret: ${SUMMER_JWT_SECRET:-change-me-in-production-use-a-strong-secret-at-least-32-bytes}
  expiration-ms: 86400000
