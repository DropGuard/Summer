name: Publish to Maven Central

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse manual dispatch of a -SNAPSHOT version
        # A manual run on main deploys whatever the POMs carry — a -SNAPSHOT would flow
        # straight into the Central publish. Tag pushes are the supported release path.
        run: |
          if grep -q '<version>.*-SNAPSHOT</version>' summer-parent/pom.xml; then
            echo "::error::workflow_dispatch on a -SNAPSHOT main; use the release script + v* tag"
            exit 1
          fi
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          server-id: central
          server-username: MAVEN_CENTRAL_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN

      - name: Import GPG Key
        id: import-gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Publish GPG Public Key to Keyservers
        run: |
          gpg --keyserver hkps://keyserver.ubuntu.com --send-keys ${{ steps.import-gpg.outputs.fingerprint }} || true
          gpg --keyserver hkps://keys.openpgp.org --send-keys ${{ steps.import-gpg.outputs.fingerprint }} || true
          gpg --keyserver hkps://pgp.mit.edu --send-keys ${{ steps.import-gpg.outputs.fingerprint }} || true

      - name: Build and Publish to Maven Central
        run: mvn -B clean deploy -P release -DskipTests
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
