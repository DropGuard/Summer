name: Publish to GitHub Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          # Wires the distributionManagement <id>github</id> to the actions token.
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      # Deploys every module (framework + summer-maven-plugin + summer-build-parent) to
      # https://maven.pkg.github.com/DropGuard/Summer.
      - run: mvn -B deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
