name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 25
      # Skipped under act: the act container image (maven:3.9-eclipse-temurin-25) already
      # provides Java 25 + Maven, and setup-java is a Node action the image lacks.
      if: env.ACT != 'true'
      uses: actions/setup-java@v5
      with:
        java-version: '25'  # project baseline (CLAUDE.md); keep in sync
        distribution: 'temurin'
        cache: maven

    - name: Check formatting
      # summer-dependencies has no Java sources; its own pom sets spotless.check.skip
      # (see the exclusion below) rather than carrying a plugin that would leak to
      # downstream consumers importing the BOM.
      run: mvn spotless:check --batch-mode -pl '!summer-dependencies'
        
    - name: Build with Maven
      # The env.CI=true is automatically set by GitHub Actions.
      # install (not verify): the summer-maven-plugin's invoker IT runs a real nested build of
      # src/it/aot-app, which resolves the framework from the local repository — the reactor
      # installs each module before the plugin module's verify phase runs its ITs. The *IT
      # integration tests run at the verify phase (failsafe bound in summer-parent's active
      # plugins; the old "integration-tests maven profile" never existed — a bare failsafe
      # declaration silently skipped every IT).
      run: mvn clean install --batch-mode

    - name: Build and integration-test AOT demos (samples aggregator)
      # Demos bind summer-maven-plugin: this proves the plugin generates + compiles the
      # AOT context for full-stack apps and flips application.yml to aot.
      run: mvn -f samples/pom.xml verify --batch-mode

    - name: Verify IT-bearing modules ran ITs
      # failIfNoTests=false makes a renamed/moved *IT.java silently pass its module — the
      # old bare-failsafe bug in a new costume. Every module that SHIPS an *IT.java must
      # have produced failsafe reports.
      run: |
        missing=""
        for m in $(find . -path '*/src/test/*IT.java' -not -path '*/target/*' | sed -E 's|^\./(.*)/src/test/.*|\1|' | sort -u); do
          if ! ls "$m"/target/failsafe-reports/*.xml >/dev/null 2>&1; then
            missing="$missing $m"
          fi
        done
        if [ -n "$missing" ]; then
          echo "::error::IT-bearing modules ran 0 ITs:$missing"
          exit 1
        fi
