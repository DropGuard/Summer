name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 26
      uses: actions/setup-java@v3
      with:
        java-version: '26'
        distribution: 'temurin'
        cache: maven

    - name: Check formatting
      # summer-dependencies is a standalone BOM (no parent, no spotless plugin in its
      # build) — Maven's prefix resolution fails on it. It has no Java sources, so it is
      # excluded here rather than given a plugin of its own (which would leak to
      # downstream consumers importing the BOM).
      run: mvn spotless:check --batch-mode -pl '!summer-dependencies'
        
    - name: Build with Maven
      # The env.CI=true is automatically set by GitHub Actions,
      # which activates our 'integration-tests' maven profile!
      # install (not verify): the summer-maven-plugin's invoker IT runs a real nested build of
      # src/it/aot-app, which resolves the framework from the local repository — the reactor
      # installs each module before the plugin module's verify phase runs its ITs.
      run: mvn clean install --batch-mode

    - name: Build AOT demo (summer-realworld)
      # The demo binds summer-maven-plugin: this proves the plugin generates + compiles the
      # AOT context for a full-stack app (web + jdbc) and flips its application.yml to aot.
      run: mvn -f summer-realworld/pom.xml package -DskipTests --batch-mode
