# Qodana Local Configuration File
# This tells the Qodana JVM Linter what rules to enforce and ignore.

version: "1.0"
linter: jetbrains/qodana-jvm:latest

# Define global project exclusions
exclude:
  - name: All
    paths:
      - "summer-example/.*"      # Ignore the example directory
      - ".*\\.md"               # Ignore markdown docs
      - ".git/.*"               # Ignore Git internals

# Specific IntelliJ Inspections to enable or disable
include:
  - name: DeprecatedIsStillUsed
  - name: VulnerableLibrariesLocal
  - name: ConstantConditions

# You can connect this to JetBrains Cloud to share results with your team.
# It requires setting up a QODANA_TOKEN in CI.
